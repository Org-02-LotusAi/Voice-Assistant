[project]
name = "service015"
version = "0.1.0"
description = "SAFI Service 015 - AI Voice Identity Workbench"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "httpx",
    "livekit-api==1.2.1",
]

[dependency-groups]
dev = [
    "pytest",
    "openapi-spec-validator",
    "jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service015"]

[tool.pytest.ini_options]
testpaths = ["tests"]
