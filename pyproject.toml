[project]
name = "service015"
version = "0.1.0"
description = "SAFI Service 015 - AI Voice Identity Workbench"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "httpx",
    "livekit-api==1.2.1",
    "python-multipart>=0.0.32",
    "livekit-agents==1.8.3",
    "livekit-plugins-openai==1.8.3",
    "livekit-plugins-silero==1.8.3",
    "moonshine-voice==0.1.5",
    "numpy>=2.5.3",
    "psutil>=5.9",
    "aiohttp>=3.9",
    "argon2-cffi==25.1.0",
]

[project.scripts]
service015-api = "service015.api.app:main"
service015-admin = "service015.admin_cli:main"
service015-expert = "service015.expert.cli:main"
service015-runtime = "service015.runtime.worker:main"

[dependency-groups]
dev = [
    "pytest",
    "openapi-spec-validator",
    "jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service015"]

[tool.pytest.ini_options]
testpaths = ["tests"]
