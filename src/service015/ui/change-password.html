<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password - Identity Workbench</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<main>
  <div id="hdr"></div>
  <div class="narrow">
    <section>
      <h2>Change password</h2>
      <p id="forced" class="notice hidden">You must choose a new password before continuing.</p>
      <form id="form" autocomplete="off">
        <label for="current">Current password</label>
        <input id="current" type="password" autocomplete="current-password" required>
        <label for="next">New password (at least 12 characters, not your username)</label>
        <input id="next" type="password" autocomplete="new-password" minlength="12" required>
        <label for="again">Repeat new password</label>
        <input id="again" type="password" autocomplete="new-password" minlength="12" required>
        <div class="row spaced"><button id="submit" type="submit" class="primary">Change password</button></div>
      </form>
      <div id="msg" class="notice"></div>
      <div id="globalError" class="error hidden" role="alert"></div>
    </section>
  </div>
</main>
<script src="/ui/common.js"></script>
<script src="/ui/change-password.js"></script>
</body>
</html>
