openapi: 3.1.0
info:
  title: SAFI Service 015 - AI Voice Identity Workbench control plane
  version: 0.1.0
  description: |
    REST contract used by the Workbench UI and by an external Meeting Manager platform.

    Every operation except `GET /health`, `GET /openapi.yaml` and `POST /auth/login` requires authentication, by one of
    two paths that share one authorization model:

    * **Machines** send `Authorization: Bearer <token>`: an env API key (`SERVICE015_API_KEYS`) or an admin-managed
      service token. Their roles are `admin`, `operator`, `viewer` (hierarchical: admin includes operator includes viewer).
      An `operator` token acts on every owner's resources, exactly as before accounts existed.
    * **Humans** sign in with `POST /auth/login` and then carry the HttpOnly `s015_session` cookie. Every non-GET request
      made with the cookie must also send the `X-CSRF-Token` header (value returned by login / `GET /auth/me`), else 403
      `csrf_failed`. Roles are `admin` (ranks as admin), `user` (ranks as operator but is **owner-scoped**) and `viewer`
      (read-only). An account flagged `must_change_password` gets 403 `password_change_required` everywhere except
      `/auth/change-password`, `/auth/me` and `/auth/logout`. A Bearer header, when present, wins over the cookie.

    The minimum rank for each operation is given in `x-required-role` (`none` = unauthenticated); a `user` session
    satisfies `operator`, never `admin`. The extension `x-also-allowed: [user-session]` widens an `admin` operation to
    signed-in `user` accounts (viewer accounts, operator keys and operator tokens are still refused).

    **Owner scoping.** Identities (personas) carry an owner. A `user` lists, reads, edits, launches, stops, archives and
    dials only their own; for any other identity they get 404 `identity_not_found`, indistinguishable from a missing one.
    `admin`, `viewer` accounts and token / env-key principals see all owners. Templates are visible when shared or owned
    by the caller (admin, tokens and env keys see all); a disabled template cannot be instantiated (409
    `template_disabled`). A voice is shared when unowned or owned by an admin; a `user` or `viewer` account sees and may
    attach only shared voices plus their own; a disabled voice cannot be attached or launched (422 `voice_disabled`).
    Archived identities are hidden from every listing and answer 404.

    **Authoring.** `POST /templates` and `POST /voices` are `admin` operations that also allow a signed-in `user` account
    (`x-also-allowed: [user-session]`). An admin authors shared templates and voices; a `user` authors private ones (owned by
    them, visible and usable only to them and to admins). Private template ids are namespaced per owner: the server stores
    a user's `sales` as `<username>.sales` (the dot is reserved, shared ids never contain one), so two users can both create
    `sales`, and no response ever reveals another owner's ids; a template the caller may not see answers 404 like a missing
    one. Private templates obey exactly the same validation, and every template's runtime instructions get a non-removable
    `LOCKED GUARDRAILS` block appended by the service (see `GET /identities/{identity_id}/self-context`).
    **Expert sessions** created by a human account are private to that account (admins see all); other sessions answer
    404 `session_not_found`.

    Every non-2xx JSON body is an `ErrorBody`, including 404 `not_found` / 405 `method_not_allowed`
    for unknown routes or methods. `error.details` conventions: `field` names the offending override
    (with `allowed` or `required` lists where relevant); 403 carries `required_role` and `role`.
servers:
  - url: http://localhost:8015
    description: Local development
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: auth
  - name: admin
  - name: health
  - name: templates
  - name: identities
  - name: meeting
  - name: phone
  - name: expert
  - name: voices

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness and dependency check
      security: []
      x-required-role: none
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Service and its dependencies are healthy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        "503":
          description: A dependency is unavailable. Body is still a Health object with status `degraded`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}

  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      tags: [health]
      summary: This contract, as YAML
      security: []
      x-required-role: none
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: {type: string}

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with username and password
      description: |
        Sets the HttpOnly `s015_session` cookie (SameSite=Strict, `Secure` on https) and returns the CSRF token to send
        as `X-CSRF-Token` on later writes. Sessions expire after 12 h idle or 7 d absolute. Failures answer a generic 401
        `invalid_credentials` whether the username exists or not; after 5 failures per username (or 20 per IP) within
        15 minutes the answer is 429 `too_many_attempts` with a `Retry-After` header.
      security: []
      x-required-role: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie:
              schema: {type: string}
              description: "`s015_session=<opaque id>; HttpOnly; SameSite=Strict; Path=/`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginResponse"}
        "401":
          description: Wrong username or password (`invalid_credentials`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorBody"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyAttempts"}

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: Revokes the session and clears the cookie. A no-op for Bearer callers. Needs the CSRF header like any session write.
      x-required-role: viewer
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "204":
          description: Signed out.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Who am I
      description: Describes the authenticated principal (account, service token or env key). Allowed while a password change is pending.
      x-required-role: viewer
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: The principal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the signed-in account's password
      description: |
        Session callers only (Bearer callers get 403 `session_required`). Verifies the current password (wrong ones count
        toward throttling, 429 `too_many_attempts`), applies the password policy (12-128 characters, not the username,
        not a common password: 422 `weak_password`), clears `must_change_password` and revokes the account's other
        sessions. Allowed while a password change is pending.
      x-required-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangePasswordRequest"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Password changed; the session stays valid.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyAttempts"}

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List templates (latest version of each)
      description: Shared templates plus, for a `user` or `viewer` account, their own private ones; admin, tokens and env keys see all.
      x-required-role: viewer
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Template summaries ordered by template_id.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/TemplateSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Create a template (v1) or a new version of an existing template
      description: |
        An admin creates a shared template (visible to everyone, owned by the creating admin account, if any) under the given
        `template_id`; a `user` creates a private template owned by them, stored (and returned) as
        `<username>.<template_id>`. A new id creates version 1; the same id again creates the next version (for a user, of
        their own namespaced family). The `template_id` you send is a slug without dots. Earlier versions and the identities
        bound to them are never modified. The same validation applies to every template; guardrails are not part of a
        template and cannot be edited or removed by one.
      x-required-role: admin
      x-also-allowed: [user-session]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TemplateCreate"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "201":
          description: The stored template version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TemplateBody"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /templates/{template_id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get one template version (latest unless `version` is given)
      x-required-role: viewer
      parameters:
        - {$ref: "#/components/parameters/TemplateId"}
        - name: version
          in: query
          required: false
          schema: {type: integer, minimum: 1}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: The template version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TemplateBody"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

    patch:
      operationId: patchTemplate
      tags: [templates, admin]
      summary: Disable / enable a template, change sharing, or assign its owner
      description: |
        Admin only. Only the fields present are changed. `disabled: true` blocks new instantiation (409
        `template_disabled`); identities already created from it are unaffected. `owner_user_id` hands the template to a
        active `user` account (404 `user_not_found`, 422 `invalid_owner`) or, when null, leaves it unowned. An empty body is 422 `empty_patch`.
      x-required-role: admin
      parameters:
        - {$ref: "#/components/parameters/TemplateId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TemplatePatch"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: The updated template summary.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TemplateSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /templates/{template_id}/versions:
    get:
      operationId: listTemplateVersions
      tags: [templates]
      summary: List the version numbers of a template, ascending
      x-required-role: viewer
      parameters:
        - {$ref: "#/components/parameters/TemplateId"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Version numbers.
          content:
            application/json:
              schema:
                type: array
                items: {type: integer, minimum: 1}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /templates/{template_id}/instantiate:
    post:
      operationId: instantiateTemplate
      tags: [templates]
      summary: Create an Identity from a template version
      description: |
        Binds the new Identity to `template_version` (latest when omitted) permanently.
        Failures: `override_not_allowed`, `missing_required_field`, `invalid_override` (all 422),
        `template_not_found` (404). A non-null resolved `voice.profile_id` must exist in Voicebox and have a cloning
        authorization: 422 `voice_profile_not_found` / `voice_not_authorized`; Voicebox down: 503
        `voicebox_unavailable` (nothing is persisted).
      x-required-role: operator
      parameters:
        - {$ref: "#/components/parameters/TemplateId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InstantiateRequest"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "201":
          description: The new Identity, fully resolved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResolvedIdentity"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}

  /identities:
    get:
      operationId: listIdentities
      tags: [identities]
      summary: List identity summaries
      description: A `user` account sees only their own identities; admin, viewer accounts and tokens see all. Archived identities are hidden.
      x-required-role: viewer
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Identity summaries ordered by identity_id.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/IdentitySummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /identities/{identity_id}:
    get:
      operationId: getIdentity
      tags: [identities]
      summary: Get the resolved Identity snapshot
      x-required-role: viewer
      parameters:
        - {$ref: "#/components/parameters/IdentityId"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: The resolved Identity.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResolvedIdentity"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: patchIdentity
      tags: [identities]
      summary: Change an Identity's overrides
      description: |
        Merges `overrides` into the stored overrides (a `null` value clears that override) and
        re-validates against the template version the Identity is bound to (never the latest).
        `identity_id`, `participant_identity` and `default_room` never change.
        Changing `voice.profile_id` to a non-null value applies the same voice rules as instantiate
        (422 `voice_profile_not_found` / `voice_not_authorized`, 503 `voicebox_unavailable`); patches that leave the
        voice unchanged, and clearing it, do not call Voicebox.
      x-required-role: operator
      parameters:
        - {$ref: "#/components/parameters/IdentityId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PatchIdentityRequest"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: The re-resolved Identity.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResolvedIdentity"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}

    delete:
      operationId: archiveIdentity
      tags: [identities]
      summary: Archive an Identity
      description: |
        Stops the runtime when the Identity is not OFFLINE (a failure to stop leaves it unarchived and propagates, e.g.
        503), then sets `archived_at`. The Identity disappears from lists, the roster and every per-identity route
        (404); its record is retained and its `identity_id` is never reused. There is no hard delete. A `user` may
        archive only their own.
      x-required-role: operator
      parameters:
        - {$ref: "#/components/parameters/IdentityId"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: The Identity is archived.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArchivedIdentity"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}

  /identities/{identity_id}/self-context:
    get:
      operationId: getSelfContext
      tags: [identities]
      summary: Inspect the authoritative self-context and runtime instructions
      description: Reproducible from the stored snapshot alone (SOW section 11).
      x-required-role: viewer
      parameters:
        - {$ref: "#/components/parameters/IdentityId"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Self-context block, full instructions and the snapshot hash they derive from.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SelfContext"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /identities/{identity_id}/launch:
    post:
      operationId: launchIdentity
      tags: [identities]
      summary: Start the Identity's runtime participant
      description: |
        Voice preflight runs before the runtime is touched: the Identity must have a voice
        (422 `voice_required` when `voice.profile_id` is null; there is never a fallback voice), and that voice must
        still exist in Voicebox and have a cloning authorization (422 `voice_profile_not_found` /
        `voice_not_authorized`). Voicebox down: 503 `voicebox_unavailable`. Returns 503 `dependency_unavailable`
        when no runtime is configured.
      x-required-role: operator
      parameters:
        - {$ref: "#/components/parameters/IdentityId"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Participant status immediately after the launch request.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParticipantStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: |
            `capacity_exceeded`: `SERVICE015_MAX_ACTIVE_IDENTITIES` (default 4) Identities are already STARTING, READY or
            BUSY (`details.active`, `details.limit`). Stop one first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorBody"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}

  /identities/{identity_id}/stop:
    post:
      operationId: stopIdentity
      tags: [identities]
      summary: Stop the Identity's runtime participant
      description: Returns 503 `dependency_unavailable` when no runtime is configured.
      x-required-role: operator
      parameters:
        - {$ref: "#/components/parameters/IdentityId"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Participant status immediately after the stop request.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParticipantStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}

  /identities/{identity_id}/status:
    get:
      operationId: getIdentityStatus
      tags: [identities]
      summary: Participant presence and capabilities
      x-required-role: viewer
      parameters:
        - {$ref: "#/components/parameters/IdentityId"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Current participant status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParticipantStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /identities/{identity_id}/join-token:
    post:
      operationId: createJoinToken
      tags: [identities]
      summary: Mint a LiveKit join token for a human to enter the Identity's Default Room
      description: |
        The token grants a participant `human-<random8>` (never the Identity's own participant identity) publish and
        subscribe in the Identity's `default_room`. It is valid for one hour and works whether or not the Identity is
        currently launched.
      x-required-role: operator
      parameters:
        - {$ref: "#/components/parameters/IdentityId"}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JoinTokenRequest"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Connection details for a LiveKit client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JoinToken"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /identities/{identity_id}/latency:
    get:
      operationId: getIdentityLatency
      tags: [identities]
      summary: Per-turn latency percentiles (milliseconds)
      description: |
        Nearest-rank P50/P95/max over recorded turns. T0 user stops speaking, T1 final transcript, T2 first LLM chunk,
        T3 first TTS audio, T4 agent starts speaking, T5 first audio heard by the human (filled by the e2e harness).
        Intervals are raw measurements and may be negative (the transcript can finalize before end-of-speech).
        An interval with no data reports `count` 0 and null statistics.
      x-required-role: viewer
      parameters:
        - {$ref: "#/components/parameters/IdentityId"}
        - name: session_id
          in: query
          required: false
          schema: {type: string}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Latency report.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LatencyReport"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /meeting/participants:
    get:
      operationId: listMeetingParticipants
      tags: [meeting]
      summary: Participant roster for a Meeting Manager
      description: |
        Metadata only (SOW section 19): identity, room, presence and capabilities for every
        identity. No STT, TTS, LLM or prompt internals.
      x-required-role: viewer
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: One ParticipantStatus per identity, ordered by identity_id.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ParticipantStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /identities/{identity_id}/phone/dial:
    post:
      operationId: dialIdentityPhone
      tags: [phone]
      summary: Dial a phone number into the Identity's Default LiveKit Room
      description: |
        Service 015 does not implement SIP/PSTN. The call is placed through Service 014
        (`SERVICE014_MODE`): `livekit_sip` uses LiveKit `CreateSIPParticipant` on the shared
        LiveKit deployment (participant identity `phone-<last4>-<rand4>`, unique per call; waits until answered);
        `http` POSTs `{room, to}` to `{SERVICE014_URL}/calls` with a bearer `SERVICE014_API_KEY`.
        **The `http` contract is an ASSUMPTION** (the real Service 014 HTTP API is not yet known) and
        is isolated in one class. `disabled` (the default) answers 503 `telephony_not_configured`.

        **This request is synchronous.** In `livekit_sip` mode it blocks until the callee answers or the
        45 s ringing timeout expires (then 502 `telephony_failed`); in `http` mode it blocks until Service 014
        replies (up to 60 s). Callers should use a client timeout of at least 70 s. In `http` mode a missing
        `SERVICE014_API_KEY` is reported as 503 `telephony_not_configured` (never an unauthenticated call).

        Destination control: `to` must start with one of the E.164 prefixes in `SERVICE014_ALLOWED_DESTINATIONS`
        (403 `destination_not_allowed`); an empty list denies every number when `SERVICE015_PUBLIC_URL` is not local
        and allows any on localhost. Only one dial per Identity may be in flight (409 `dial_in_progress`).

        Errors: 404 unknown identity; 409 `identity_not_ready` unless presence is READY or BUSY;
        422 `invalid_request` when `to` is not E.164; 502 `telephony_failed` / `telephony_bad_response`
        when Service 014 or the SIP layer fails; 503 `telephony_not_configured`. The phone number is
        never logged in full.
      x-required-role: operator
      parameters:
        - {$ref: "#/components/parameters/IdentityId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DialRequest"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "202":
          description: The call was placed (`status` is `answered` for livekit_sip; for http it is whatever Service 014 reports, default `dialing`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PhoneCall"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Role too low (`forbidden`) or the destination is not allowed (`destination_not_allowed`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorBody"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Identity presence is not READY or BUSY (`identity_not_ready`; `details.presence`), or a dial for this Identity is already in flight (`dial_in_progress`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorBody"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "502":
          description: Service 014 or the SIP layer failed (`telephony_failed`, `telephony_bad_response`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorBody"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}

  /identities/{identity_id}/phone:
    get:
      operationId: getIdentityPhone
      tags: [phone]
      summary: Telephony mode, Default Room and inbound route for the Identity
      description: |
        `inbound` is non-null only in `livekit_sip` mode, where inbound calls are routed by a
        LiveKit `SIPDispatchRuleDirect(room_name=default_room)`; Service 015 does not create the rule.
      x-required-role: viewer
      parameters:
        - {$ref: "#/components/parameters/IdentityId"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Phone configuration.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PhoneInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /voices:
    get:
      operationId: listVoices
      tags: [voices]
      summary: List cloned Voicebox voice profiles and whether each is authorized
      description: |
        Cloned Voicebox profiles only (the Chatterbox Turbo engine needs cloned voices). `authorized` is true when
        a `voice_authorizations` row exists for the profile; only authorized voices can be attached to an Identity.
        Voicebox down: 503 `voicebox_unavailable`.
      x-required-role: viewer
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Cloned voice profiles.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/VoiceProfile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}
    post:
      operationId: createVoice
      tags: [voices]
      summary: Clone a voice from a reference sample and record its authorization
      description: |
        Creates the Voicebox cloned profile (Chatterbox Turbo) from the uploaded reference audio, then records the
        `voice_authorizations` row (consent statement, subject, authorizing person). If Voicebox fails nothing is
        recorded; if recording fails the new profile is removed again. The raw audio is never stored by this
        service, returned, or logged. The request must carry a Content-Length of at most 25 MiB plus form fields
        (413 `sample_too_large`, also when the header is missing). The file must be wav, mp3, m4a, ogg, flac or
        webm: its content type must be an audio type (or `application/octet-stream`) and its magic bytes must match
        (415 `unsupported_media_type`). The stored filename is sanitized to a basename. Empty file: 422 `empty_sample`.
        Only cloned profiles exist for this engine: Chatterbox Turbo has no presets in Voicebox, so preset voices
        cannot be created, authorized or attached.
        Voicebox down: 503 `voicebox_unavailable`; Voicebox rejecting the sample: 502 `voicebox_rejected`.
        An admin creates a shared voice; a `user` account creates a voice they own, usable only for their own personas.
        The consent statement, subject name and authorizing person are mandatory for everyone.
      x-required-role: admin
      x-also-allowed: [user-session]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/VoiceCreateForm"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "201":
          description: The created profile, already authorized.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VoiceProfile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413":
          description: Reference audio too large or Content-Length missing (`sample_too_large`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorBody"}
        "415":
          description: Not a wav/mp3/m4a/ogg/flac/webm file (`unsupported_media_type`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorBody"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}

  /voices/{voice_profile_id}:
    patch:
      operationId: patchVoice
      tags: [voices, admin]
      summary: Disable / enable a voice or assign its owner
      description: |
        Admin only. `disabled: true` blocks new attachment (422 `voice_disabled`), preview and launch preflight; a persona that
        is already running is not interrupted. `owner_user_id` hands the voice to an active `user` account (404 `user_not_found`, 422 `invalid_owner`; it is then private to them) or, when
        null, makes it unowned (shared). The voice must have a recorded authorization (404 `voice_profile_not_found`).
      x-required-role: admin
      parameters:
        - {$ref: "#/components/parameters/VoiceProfileId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VoicePatch"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: The voice profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VoiceProfile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}

  /voices/{voice_profile_id}/authorizations:
    post:
      operationId: authorizeVoice
      tags: [voices]
      summary: Record a cloning authorization for a profile created directly in Voicebox
      description: |
        The profile must exist in Voicebox (404 `voice_profile_not_found`) and be a cloned profile
        (422 `voice_profile_not_cloned`; preset voices cannot be used with Chatterbox Turbo). Multiple authorization rows per profile are allowed (append-only).
        Voicebox down: 503 `voicebox_unavailable`.
      x-required-role: admin
      parameters:
        - {$ref: "#/components/parameters/VoiceProfileId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VoiceAuthorizationCreate"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "201":
          description: The recorded authorization.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VoiceAuthorization"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}

  /voices/{voice_profile_id}/preview:
    post:
      operationId: previewVoice
      tags: [voices]
      summary: Synthesize a short preview of an authorized voice (audio/wav)
      description: |
        Synthesis runs on the voice engine sidecar (Chatterbox Turbo). On CPU a short sentence takes roughly
        15-40 s; the wait is bounded by `VOICE_ENGINE_TIMEOUT_S` (default 120). The voice must exist in Voicebox
        (404 `voice_profile_not_found`) and be authorized (422 `voice_not_authorized`). Engine or Voicebox down:
        503 `voice_engine_unavailable` / `voicebox_unavailable`. `text` defaults to
        "Hello, this is a preview of my voice." (max 500 characters).
      x-required-role: operator
      parameters:
        - {$ref: "#/components/parameters/VoiceProfileId"}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VoicePreviewRequest"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: A complete WAV file (mono, 16-bit PCM, 24 kHz).
          content:
            audio/wav:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}

  /expert/experience:
    post:
      operationId: addExpertExperience
      tags: [expert]
      summary: Ingest one VERIFIED EXPERIENCE fact with provenance
      description: |
        Stores a fact verified during development as `verified_experience` knowledge. It survives every
        document re-ingest and is visible to every new Expert session (SOW 24). `repo`, `branch` and `sha`
        must be given together, or all omitted to resolve them with `git rev-parse` in the service's repository (see `POST /expert/reingest`)
        (422 `provenance_unresolved` if that fails). `sha` must be 7-40 lowercase hex characters.
        Idempotent on (`title`, `sha`): a repeat returns the existing item with 200 instead of 201.
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExperienceCreate"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: An item with the same title and sha already existed; returned unchanged.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExpertKnowledgeItem"}
        "201":
          description: The stored knowledge item (metadata).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExpertKnowledgeItem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /expert/reingest:
    post:
      operationId: reingestExpert
      tags: [expert, admin]
      summary: Re-ingest the Service Expert manifest documents
      description: |
        Replaces the `document` chunks of every manifest source found under the service's repository root. Verified
        experience is never touched. Missing required sources are reported in `missing_required`, not as an error.
        The root is `SERVICE015_REPO_ROOT`, else the repository containing the installed package - never the process working
        directory; provenance (repo, branch, sha) comes from git there (422 `provenance_unresolved` if it is not a checkout).
      x-required-role: admin
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: What was ingested.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReingestResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /expert/knowledge:
    get:
      operationId: listExpertKnowledge
      tags: [expert]
      summary: List knowledge metadata visible to the caller's role
      description: |
        Metadata only (never the text). Items whose `min_role` is above the caller's role are omitted.
        `missing_required` lists manifest sources marked required that have no ingested chunk (a warning, not an error).
      x-required-role: viewer
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Knowledge items in ingestion order, plus required manifest sources still missing.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExpertKnowledgeList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /expert/sessions:
    post:
      operationId: createExpertSession
      tags: [expert]
      summary: Start a fresh Service Expert chat session
      description: |
        A new session has an empty history. Knowledge comes only from the store, never from other sessions. A session
        created by a human account is private to that account (admins may use any session).
      x-required-role: viewer
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "201":
          description: The new session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExpertSession"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /expert/sessions/{session_id}/ask:
    post:
      operationId: askExpert
      tags: [expert]
      summary: Ask the scoped Service Expert a question
      description: |
        Retrieves the top role-visible knowledge (BM25, verified experience preferred) and answers from it with
        the configured LLM, citing `[source@sha]`. Errors: 404 `session_not_found`; 403 `forbidden` when the
        session was created by a higher role; 404 also when a human `user` / `viewer` account asks in a session it did not
        create; 503 `llm_unavailable` when the LLM is not configured or
        unreachable (no answer is ever fabricated).
      x-required-role: viewer
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AskRequest"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: The grounded answer and the knowledge items it cited.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AskResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}

  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List accounts
      x-required-role: admin
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: All accounts ordered by username (never password material).
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AdminUser"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createUser
      tags: [admin]
      summary: Create an account with a temporary password
      description: |
        The password must satisfy the password policy (422 `weak_password`) and is temporary: the account has
        `must_change_password` and is limited to `/auth/change-password` until it changes it. Roles `user` and `viewer` only
        (admin accounts exist only through the bootstrap). Duplicate username: 409 `username_taken`.
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminUserCreate"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "201":
          description: The new account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUser"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /admin/users/{user_id}:
    patch:
      operationId: patchUser
      tags: [admin]
      summary: Disable / enable an account, change its role, or reset its temporary password
      description: |
        Only the fields present are changed; an empty body is 422 `empty_patch`. Disabling, a role change and a password
        reset all revoke the account's sessions immediately; a reset also sets `must_change_password`. `role` is `user` or
        `viewer`. Admin accounts cannot be modified here (409 `admin_account_protected`). Unknown user: 404 `user_not_found`.
      x-required-role: admin
      parameters:
        - {$ref: "#/components/parameters/UserId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminUserPatch"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: The updated account.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUser"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /admin/tokens:
    get:
      operationId: listServiceTokens
      tags: [admin]
      summary: List service tokens
      description: Id, label, role and timestamps of every token, revoked ones included. Never the secret.
      x-required-role: admin
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Service tokens in creation order.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ServiceTokenInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createServiceToken
      tags: [admin]
      summary: Create a service token
      description: |
        Returns the secret (`s015_...`) exactly once; only its sha256 is stored, so it cannot be shown again. Send it as
        `Authorization: Bearer <token>`. Roles `viewer` and `operator`.
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ServiceTokenCreate"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "201":
          description: The token, including its one-time secret.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServiceTokenCreated"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /admin/tokens/{token_id}:
    delete:
      operationId: revokeServiceToken
      tags: [admin]
      summary: Revoke a service token
      description: "The token stops authenticating immediately. Unknown or already revoked: 404 `token_not_found`."
      x-required-role: admin
      parameters:
        - {$ref: "#/components/parameters/TokenId"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "204": {description: Revoked.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /admin/identities:
    get:
      operationId: listAllIdentities
      tags: [admin]
      summary: List every persona of every owner
      description: With `include_archived=true` archived personas are listed too (with `archived_at`).
      x-required-role: admin
      parameters:
        - name: include_archived
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Personas ordered by identity_id.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AdminIdentity"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /admin/identities/{identity_id}:
    patch:
      operationId: assignIdentityOwner
      tags: [admin]
      summary: Assign a persona to a user
      description: |
        Hands a persona (also an archived or machine-created one) to the given user; null leaves it unowned. The target must
        be an active account with role `user` (422 `invalid_owner` for a disabled, viewer or admin account; 404
        `user_not_found`). If the persona's voice is private to someone else and so unusable by the new owner, the call is
        refused with 409 `voice_not_accessible` unless `clear_voice` is true, which sets `voice.profile_id` to null (the
        persona then needs a voice before it can launch: 422 `voice_required`). Unknown identity: 404 `identity_not_found`.
      x-required-role: admin
      parameters:
        - {$ref: "#/components/parameters/IdentityId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IdentityOwnerPatch"}
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: The persona with its new owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminIdentity"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /admin/voices:
    get:
      operationId: listAllVoices
      tags: [admin]
      summary: List every cloned voice with owner, flags and consent record
      description: "Voicebox down: 503 `voicebox_unavailable`."
      x-required-role: admin
      responses:
        "500": {$ref: "#/components/responses/InternalError"}
        "200":
          description: Cloned profiles with ownership and consent.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AdminVoice"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502": {$ref: "#/components/responses/BadGateway"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key from SERVICE015_API_KEYS ("key:role" pairs) or an admin-issued service token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: s015_session
      description: |
        Session cookie set by `POST /auth/login`. Non-GET requests must also send `X-CSRF-Token` (403 `csrf_failed`).

  parameters:
    TemplateId:
      name: template_id
      in: path
      required: true
      schema: {type: string, pattern: '^([a-z0-9][a-z0-9_.-]{2,31}\.)?[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 100, description: "A shared slug, or `<owner_username>.<slug>` for a private template."}
    IdentityId:
      name: identity_id
      in: path
      required: true
      schema: {type: string}
    VoiceProfileId:
      name: voice_profile_id
      in: path
      required: true
      schema: {type: string}
    UserId:
      name: user_id
      in: path
      required: true
      schema: {type: string}
    TokenId:
      name: token_id
      in: path
      required: true
      schema: {type: string}

  responses:
    Unauthorized:
      description: Missing or unknown API key, or a missing / expired / revoked session (`unauthorized`).
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    Forbidden:
      description: |
        The caller's role is below the operation's `x-required-role` (`forbidden`), a session write lacks a valid
        `X-CSRF-Token` (`csrf_failed`), the account must change its password first (`password_change_required`), or a
        Bearer caller used a session-only operation (`session_required`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    NotFound:
      description: |
        Resource not found (`template_not_found`, `identity_not_found`, `voice_profile_not_found`, `user_not_found`, `token_not_found`, `session_not_found`). Also the answer for
        resources the caller is not allowed to see (another user's identity, a private template, a voice they do not own).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    Unprocessable:
      description: |
        Request invalid: `invalid_request` (shape), `override_not_allowed`, `missing_required_field`,
        `invalid_override`, `voice_profile_not_found` / `voice_not_authorized` (the resolved `voice.profile_id` must
        exist in Voicebox and have a cloning authorization), `voice_profile_not_cloned`, `empty_sample`,
        `voice_required` (launch), `reference_too_short`, `weak_password`, `invalid_username`, `role_not_allowed`, `empty_patch`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    Conflict:
      description: |
        The request conflicts with current state (`template_disabled`, `voice_not_accessible`, `username_taken`, `admin_account_protected`, `capacity_exceeded`, `identity_not_ready`,
        `dial_in_progress`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    TooManyAttempts:
      description: Too many failed sign-in attempts (`too_many_attempts`); see the `Retry-After` header.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    InternalError:
      description: Unexpected server error (`internal_error`) or corrupt stored data (`corrupt_template`, `corrupt_identity`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    BadGateway:
      description: An upstream service answered unexpectedly (`voicebox_rejected`, `voicebox_bad_response`, `voice_engine_error`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    DependencyUnavailable:
      description: |
        A required backing service is not available (`dependency_unavailable`, `voicebox_unavailable`,
        `voice_engine_unavailable`, `telephony_not_configured`, `runtime_unavailable`). Launch preflight failures are
        `dependency_unavailable` with `details.dependency` = `livekit` | `llm` | `voice_engine` | `voicebox`, and leave
        the Identity untouched. Nothing is persisted.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}

  schemas:
    ErrorBody:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
            message: {type: string}
            details: {type: object}

    Health:
      type: object
      additionalProperties: false
      required: [status, version, dependencies]
      properties:
        status: {type: string, enum: [ok, degraded]}
        version: {type: string}
        dependencies:
          type: object
          description: |
            `database`: ok | error. `runtime`: ok when a runtime supervisor is configured,
            otherwise not_configured (informational; does not degrade status). `voicebox`: ok | unavailable.
            `voice_engine`: ok | loading | error | unavailable (the sidecar's own status). The voice
            dependencies are informational: they never fail or degrade /health.
          additionalProperties: {type: string}
          required: [database, runtime, voicebox, voice_engine]
          properties:
            database: {type: string, enum: [ok, error]}
            runtime: {type: string, enum: [ok, not_configured]}
            voicebox: {type: string, enum: [ok, unavailable]}
            voice_engine: {type: string, enum: [ok, loading, error, unavailable]}

    VoiceProfile:
      type: object
      additionalProperties: false
      required: [voice_profile_id, name, language, engine, authorized]
      properties:
        voice_profile_id: {type: string}
        name: {type: string}
        language: {type: string}
        engine: {type: string, enum: [chatterbox-turbo]}
        authorized: {type: boolean, description: "True when a voice_authorizations row exists for this profile."}

    VoiceCreateForm:
      type: object
      additionalProperties: false
      required: [name, reference_text, file, consent_statement, subject_name, authorized_by]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, pattern: '\S'}
        language: {type: string, minLength: 2, maxLength: 20, pattern: "^[A-Za-z][A-Za-z0-9_-]*$", default: en}
        description: {type: string, maxLength: 1000, default: ""}
        reference_text: {type: string, minLength: 1, maxLength: 4000, pattern: '\S', description: Exact transcript of the sample.}
        file: {type: string, format: binary, description: Reference audio, longer than 5 s, at most 25 MiB.}
        consent_statement: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        subject_name: {type: string, minLength: 1, maxLength: 200, pattern: '\S', description: Whose voice is cloned.}
        authorized_by: {type: string, minLength: 1, maxLength: 200, pattern: '\S', description: Who authorized the cloning.}

    VoiceAuthorizationCreate:
      type: object
      additionalProperties: false
      required: [consent_statement, subject_name, authorized_by]
      properties:
        consent_statement: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        subject_name: {type: string, minLength: 1, maxLength: 200, pattern: '\S'}
        authorized_by: {type: string, minLength: 1, maxLength: 200, pattern: '\S'}
        source: {type: string, minLength: 1, maxLength: 200, pattern: '\S', default: voicebox_direct}

    VoiceAuthorization:
      type: object
      additionalProperties: false
      required: [id, voice_profile_id, authorized_by, subject_name, consent_statement, source, created_at]
      properties:
        id: {type: integer}
        voice_profile_id: {type: string}
        authorized_by: {type: string}
        subject_name: {type: string}
        consent_statement: {type: string}
        source: {type: string}
        created_at: {type: string, format: date-time}

    VoicePreviewRequest:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 500, pattern: '\S', description: "Default: Hello, this is a preview of my voice."}

    OverrideKey:
      type: string
      enum:
        - name
        - company
        - role
        - language
        - persona.instructions
        - persona.objective
        - persona.style
        - greeting
        - voice.profile_id
        - conversation.speaking_style
        - conversation.barge_in

    OverrideName:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '\S'
      description: Letters, spaces, apostrophe, hyphen and period only (checked server-side as `invalid_override`).
    OverrideFact:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '^[^\x00-\x1f\x7f]*\S[^\x00-\x1f\x7f]*$'
      description: Single line, no control characters.
    OverrideLanguage:
      type: string
      pattern: "^[a-z]{2,3}(-[A-Z]{2})?$"
    OverrideText:
      type: string
      minLength: 1
      maxLength: 4000
      pattern: '\S'
    OverrideBool:
      type: boolean

    Overrides:
      type: object
      description: |
        Flat dotted keys exactly as named in a template's `allowed_overrides`. The known keys and their
        value rules are listed under `properties`. Unknown keys are not rejected by the schema; the server
        answers 422 `override_not_allowed` for any key the template does not allow. Violating a value
        rule answers 422 `invalid_override`.
      properties:
        name: {$ref: "#/components/schemas/OverrideName"}
        company: {$ref: "#/components/schemas/OverrideFact"}
        role: {$ref: "#/components/schemas/OverrideFact"}
        language: {$ref: "#/components/schemas/OverrideLanguage"}
        persona.instructions: {$ref: "#/components/schemas/OverrideText"}
        persona.objective: {$ref: "#/components/schemas/OverrideText"}
        persona.style: {$ref: "#/components/schemas/OverrideText"}
        greeting: {$ref: "#/components/schemas/OverrideText"}
        voice.profile_id: {$ref: "#/components/schemas/OverrideText"}
        conversation.speaking_style: {$ref: "#/components/schemas/OverrideText"}
        conversation.barge_in: {$ref: "#/components/schemas/OverrideBool"}
      additionalProperties: {}

    OverridesPatch:
      type: object
      description: Like Overrides, but a `null` value clears that override.
      properties:
        name: {oneOf: [{$ref: "#/components/schemas/OverrideName"}, {type: "null"}]}
        company: {oneOf: [{$ref: "#/components/schemas/OverrideFact"}, {type: "null"}]}
        role: {oneOf: [{$ref: "#/components/schemas/OverrideFact"}, {type: "null"}]}
        language: {oneOf: [{$ref: "#/components/schemas/OverrideLanguage"}, {type: "null"}]}
        persona.instructions: {oneOf: [{$ref: "#/components/schemas/OverrideText"}, {type: "null"}]}
        persona.objective: {oneOf: [{$ref: "#/components/schemas/OverrideText"}, {type: "null"}]}
        persona.style: {oneOf: [{$ref: "#/components/schemas/OverrideText"}, {type: "null"}]}
        greeting: {oneOf: [{$ref: "#/components/schemas/OverrideText"}, {type: "null"}]}
        voice.profile_id: {oneOf: [{$ref: "#/components/schemas/OverrideText"}, {type: "null"}]}
        conversation.speaking_style: {oneOf: [{$ref: "#/components/schemas/OverrideText"}, {type: "null"}]}
        conversation.barge_in: {oneOf: [{$ref: "#/components/schemas/OverrideBool"}, {type: "null"}]}
      additionalProperties: {}

    TemplateFields:
      type: object
      properties:
        template_id: {type: string}
        name: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        default_self_facts:
          type: object
          additionalProperties: false
          properties:
            role: {type: [string, "null"]}
            company: {type: [string, "null"]}
            language: {type: string}
        persona:
          type: object
          additionalProperties: false
          required: [objective, style, instructions]
          properties:
            objective: {type: string, minLength: 1}
            style: {type: string, minLength: 1}
            instructions: {type: string, minLength: 1}
        conversation:
          type: object
          additionalProperties: false
          required: [greeting, speaking_style]
          properties:
            greeting: {type: string, minLength: 1}
            barge_in: {type: boolean}
            speaking_style: {type: string, minLength: 1}
        voice:
          type: object
          additionalProperties: false
          properties:
            default_voice_profile_id: {type: [string, "null"]}
            engine: {type: string}
        required_instance_fields:
          type: array
          items: {$ref: "#/components/schemas/OverrideKey"}
        allowed_overrides:
          type: array
          items: {$ref: "#/components/schemas/OverrideKey"}

    TemplateCreate:
      description: Template contract (SOW section 7) without server-assigned `version` and `created_at`. `required_instance_fields` must be a subset of `allowed_overrides`.
      allOf:
        - {$ref: "#/components/schemas/TemplateFields"}
        - type: object
          properties:
            template_id: {type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 64, description: "A slug without dots; a user's private template is stored as `<username>.<slug>`."}
      required: [template_id, name, description, persona, conversation]
      unevaluatedProperties: false
      examples:
        - template_id: concierge
          name: Concierge
          description: Greets visitors and routes them to the right person.
          default_self_facts: {language: en-US}
          persona:
            objective: Welcome visitors and find out who they need.
            style: Warm and brief.
            instructions: You are {name}, a concierge. Ask who the visitor wants to see, then confirm.
          conversation:
            greeting: Hello, this is {name}. Who are you here to see?
            barge_in: true
            speaking_style: Short, friendly sentences.
          voice: {default_voice_profile_id: null, engine: chatterbox-turbo}
          required_instance_fields: [name]
          allowed_overrides: [name, language, greeting]

    TemplateBody:
      description: A stored, immutable template version.
      allOf:
        - {$ref: "#/components/schemas/TemplateFields"}
        - type: object
          properties:
            template_id: {type: string, pattern: '^([a-z0-9][a-z0-9_.-]{2,31}\.)?[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 100}
            version: {type: integer, minimum: 1}
            created_at: {type: string, format: date-time}
      required:
        - template_id
        - version
        - name
        - description
        - default_self_facts
        - persona
        - conversation
        - voice
        - required_instance_fields
        - allowed_overrides
        - created_at
      unevaluatedProperties: false

    TemplateSummary:
      type: object
      additionalProperties: false
      required: [template_id, latest_version, name, description]
      properties:
        template_id: {type: string}
        latest_version: {type: integer, minimum: 1}
        name: {type: string}
        description: {type: string}
        shared: {type: boolean, description: "Shared templates are visible to everyone and managed by admins."}
        disabled: {type: boolean, description: "A disabled template cannot be instantiated (409 `template_disabled`)."}
        owner_user_id: {type: [string, "null"]}

    InstantiateRequest:
      type: object
      additionalProperties: false
      properties:
        overrides: {$ref: "#/components/schemas/Overrides"}
        template_version:
          type: [integer, "null"]
          minimum: 1
          description: Defaults to the latest version.
      examples:
        - overrides: {name: Ava, company: Safi, role: Account Specialist}
          template_version: 1

    PatchIdentityRequest:
      type: object
      additionalProperties: false
      required: [overrides]
      properties:
        overrides: {$ref: "#/components/schemas/OverridesPatch"}
      examples:
        - overrides: {role: Senior Specialist, conversation.barge_in: null}

    ResolvedIdentity:
      type: object
      additionalProperties: false
      description: Immutable-per-version instance snapshot. `resolved_hash` is the sha256 of the canonical JSON (sorted keys, no whitespace) of every other field.
      required:
        - identity_id
        - template_id
        - template_version
        - self
        - persona
        - conversation
        - voice
        - participant
        - overrides
        - resolved_hash
      properties:
        identity_id: {type: string}
        template_id: {type: string}
        template_version: {type: integer, minimum: 1}
        self:
          type: object
          additionalProperties: false
          description: Authoritative self-facts. Persona text can never override these.
          required: [identity_id, name, archetype, template_version, company, role, language]
          properties:
            identity_id: {type: string}
            name: {type: string}
            archetype: {type: string}
            template_version: {type: integer, minimum: 1}
            company: {type: [string, "null"]}
            role: {type: [string, "null"]}
            language: {type: string}
        persona:
          type: object
          additionalProperties: false
          required: [objective, style, instructions]
          properties:
            objective: {type: string}
            style: {type: string}
            instructions: {type: string}
        conversation:
          type: object
          additionalProperties: false
          required: [greeting, barge_in, speaking_style]
          properties:
            greeting: {type: string}
            barge_in: {type: boolean}
            speaking_style: {type: string}
        voice:
          type: object
          additionalProperties: false
          required: [profile_id, engine]
          properties:
            profile_id: {type: [string, "null"]}
            engine: {type: string}
        participant:
          type: object
          additionalProperties: false
          required: [participant_identity, default_room]
          properties:
            participant_identity: {type: string}
            default_room: {type: string}
        overrides: {$ref: "#/components/schemas/Overrides"}
        resolved_hash: {type: string, pattern: "^[0-9a-f]{64}$"}

    IdentitySummary:
      type: object
      additionalProperties: false
      required:
        - identity_id
        - name
        - template_id
        - template_version
        - company
        - role
        - language
        - voice_profile_id
        - participant_identity
        - default_room
        - resolved_hash
      properties:
        identity_id: {type: string}
        name: {type: string}
        template_id: {type: string}
        template_version: {type: integer, minimum: 1}
        company: {type: [string, "null"]}
        role: {type: [string, "null"]}
        language: {type: string}
        voice_profile_id: {type: [string, "null"]}
        participant_identity: {type: string}
        default_room: {type: string}
        resolved_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
        owner_user_id: {type: [string, "null"], description: "Owning account; null for machine-created identities."}

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, minLength: 1, maxLength: 256}

    UserInfo:
      type: object
      additionalProperties: false
      required: [user_id, username, role, must_change_password]
      properties:
        user_id: {type: string}
        username: {type: string, pattern: "^[a-z0-9][a-z0-9_.-]{2,31}$"}
        role: {type: string, enum: [admin, user, viewer]}
        must_change_password: {type: boolean}

    LoginResponse:
      type: object
      additionalProperties: false
      required: [user, csrf_token]
      properties:
        user: {$ref: "#/components/schemas/UserInfo"}
        csrf_token: {type: string, description: "Send as `X-CSRF-Token` on every non-GET session request."}

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, minLength: 1, maxLength: 256}
        new_password: {type: string, minLength: 1, maxLength: 256, description: "12-128 characters, not the username, not a common password."}

    Me:
      type: object
      additionalProperties: false
      required: [kind, role, effective_role, user_id, username, label, must_change_password, csrf_token]
      properties:
        kind: {type: string, enum: [user, token, envkey]}
        role: {type: string, description: "Account role (admin|user|viewer) or key / token role (admin|operator|viewer)."}
        effective_role: {type: string, enum: [admin, operator, viewer], description: "The rank used for x-required-role (`user` ranks as operator)."}
        user_id: {type: [string, "null"]}
        username: {type: [string, "null"]}
        label: {type: [string, "null"], description: "Service token label."}
        must_change_password: {type: boolean}
        csrf_token: {type: [string, "null"], description: "Session callers only."}

    ArchivedIdentity:
      type: object
      additionalProperties: false
      required: [identity_id, archived_at]
      properties:
        identity_id: {type: string}
        archived_at: {type: string, format: date-time}

    SelfContext:
      type: object
      additionalProperties: false
      required: [self_context, instructions, resolved_hash]
      properties:
        self_context: {type: string, description: "The YAML `self:` block (SOW section 10)."}
        instructions: {type: string, description: Full runtime system instructions built from the snapshot only.}
        resolved_hash: {type: string, pattern: "^[0-9a-f]{64}$"}

    JoinTokenRequest:
      type: object
      additionalProperties: false
      properties:
        participant_name: {type: [string, "null"], minLength: 1, maxLength: 80, description: Display name of the human.}

    JoinToken:
      type: object
      additionalProperties: false
      required: [livekit_url, room, token, participant_identity]
      properties:
        livekit_url: {type: string}
        room: {type: string}
        token: {type: string}
        participant_identity: {type: string, pattern: "^human-[0-9a-f]{8}$"}

    IntervalStats:
      type: object
      additionalProperties: false
      required: [count, p50, p95, max]
      properties:
        count: {type: integer, minimum: 0}
        p50: {type: [number, "null"]}
        p95: {type: [number, "null"]}
        max: {type: [number, "null"]}

    LatencyReport:
      type: object
      additionalProperties: false
      required: [turns, t0_t4, t0_t1, t1_t2, t2_t3, t3_t4, t4_t5]
      properties:
        turns: {type: integer, minimum: 0}
        t0_t4: {$ref: "#/components/schemas/IntervalStats"}
        t0_t1: {$ref: "#/components/schemas/IntervalStats"}
        t1_t2: {$ref: "#/components/schemas/IntervalStats"}
        t2_t3: {$ref: "#/components/schemas/IntervalStats"}
        t3_t4: {$ref: "#/components/schemas/IntervalStats"}
        t4_t5: {$ref: "#/components/schemas/IntervalStats"}

    Presence:
      type: string
      enum: [READY, STARTING, BUSY, ERROR, OFFLINE]

    ParticipantStatus:
      type: object
      additionalProperties: false
      description: Presence contract (SOW section 14). `RECONNECTING` appears only as an ERROR sub-state in `status_detail`; `llm_rate_limited` marks an LLM provider HTTP 429 (distinct from `llm_unavailable`).
      required:
        - identity_id
        - participant_identity
        - default_room
        - presence
        - status_detail
        - last_error
        - capabilities
        - launched_at
        - heartbeat_at
      properties:
        identity_id: {type: string}
        participant_identity: {type: string}
        default_room: {type: string}
        presence: {$ref: "#/components/schemas/Presence"}
        status_detail: {type: [string, "null"]}
        last_error: {type: [string, "null"]}
        capabilities:
          type: object
          additionalProperties: false
          required: [audio_receive, audio_publish, barge_in, video_publish]
          properties:
            audio_receive: {type: boolean}
            audio_publish: {type: boolean}
            barge_in: {type: boolean, description: Mirrors the resolved conversation.barge_in.}
            video_publish: {type: boolean}
        launched_at: {type: [string, "null"], format: date-time}
        heartbeat_at: {type: [string, "null"], format: date-time}

    DialRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: {type: string, pattern: "^\\+[1-9][0-9]{1,14}$", description: Destination in E.164 format., examples: ["+919876543210"]}

    PhoneCall:
      type: object
      additionalProperties: false
      required: [call_id, room, status]
      properties:
        call_id: {type: string}
        room: {type: string, description: The Identity's Default LiveKit Room.}
        status: {type: string}

    InboundRoute:
      type: object
      additionalProperties: false
      required: [kind, room_name]
      properties:
        kind: {type: string, enum: [SIPDispatchRuleDirect]}
        room_name: {type: string}

    PhoneInfo:
      type: object
      additionalProperties: false
      required: [mode, default_room, inbound]
      properties:
        mode: {type: string, enum: [disabled, http, livekit_sip]}
        default_room: {type: string}
        inbound:
          oneOf:
            - {$ref: "#/components/schemas/InboundRoute"}
            - {type: "null"}

    ExperienceCreate:
      type: object
      additionalProperties: false
      required: [title, body, source]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, minLength: 1, maxLength: 8000}
        source: {type: string, minLength: 1, maxLength: 500, description: "Where the fact was verified (file, test, log)."}
        repo: {type: string, minLength: 1, maxLength: 500}
        branch: {type: string, minLength: 1, maxLength: 200}
        sha: {type: string, pattern: "^[0-9a-f]{7,40}$"}
        min_role: {type: string, enum: [viewer, operator, admin], default: viewer}
      examples:
        - {title: Example warm-up fact, body: "Example: the first synthesis after a cold start takes much longer.", source: tests/example.log}

    ExpertKnowledgeItem:
      type: object
      additionalProperties: false
      required: [id, kind, title, source, repo, branch, sha, min_role, created_at, dirty]
      properties:
        id: {type: integer}
        kind: {type: string, enum: [document, verified_experience]}
        title: {type: string}
        source: {type: string}
        repo: {type: string}
        branch: {type: string}
        sha: {type: string}
        min_role: {type: string, enum: [viewer, operator, admin]}
        created_at: {type: string, format: date-time}
        dirty: {type: boolean, description: "True when the working tree was dirty at ingest, so the text may differ from `sha`."}

    ExpertKnowledgeList:
      type: object
      additionalProperties: false
      required: [items, missing_required]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ExpertKnowledgeItem"}
        missing_required:
          type: array
          items: {type: string}

    ExpertSession:
      type: object
      additionalProperties: false
      required: [session_id]
      properties:
        session_id: {type: string}

    AskRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: {type: string, minLength: 1, maxLength: 2000}

    Citation:
      type: object
      additionalProperties: false
      required: [id, kind, title, source, repo, branch, sha]
      properties:
        id: {type: integer}
        kind: {type: string, enum: [document, verified_experience]}
        title: {type: string}
        source: {type: string}
        repo: {type: string}
        branch: {type: string}
        sha: {type: string}

    AskResponse:
      type: object
      additionalProperties: false
      required: [answer, citations]
      properties:
        answer: {type: string}
        citations:
          type: array
          items: {$ref: "#/components/schemas/Citation"}

    AdminUser:
      type: object
      additionalProperties: false
      required: [user_id, username, role, must_change_password, disabled, created_at, updated_at, last_login_at]
      properties:
        user_id: {type: string}
        username: {type: string}
        role: {type: string, enum: [admin, user, viewer]}
        must_change_password: {type: boolean}
        disabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_login_at: {type: [string, "null"], format: date-time}

    AdminUserCreate:
      type: object
      additionalProperties: false
      required: [username, temporary_password]
      properties:
        username: {type: string, minLength: 1, maxLength: 64, description: "3-32 characters: lowercase letters, digits, `_`, `.`, `-`, starting with a letter or digit."}
        temporary_password: {type: string, minLength: 1, maxLength: 256, description: "Password policy applies; the user must change it at first sign-in."}
        role: {type: string, enum: [user, viewer], default: user}

    AdminUserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        disabled: {type: [boolean, "null"]}
        role: {type: [string, "null"], enum: [user, viewer, null]}
        temporary_password: {type: [string, "null"], minLength: 1, maxLength: 256}

    ServiceTokenCreate:
      type: object
      additionalProperties: false
      required: [label, role]
      properties:
        label: {type: string, minLength: 1, maxLength: 80, pattern: '\S'}
        role: {type: string, enum: [viewer, operator]}

    ServiceTokenInfo:
      type: object
      additionalProperties: false
      required: [token_id, label, role, created_at, last_used_at, revoked_at]
      properties:
        token_id: {type: string}
        label: {type: string}
        role: {type: string, enum: [viewer, operator]}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, "null"], format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}

    ServiceTokenCreated:
      type: object
      additionalProperties: false
      required: [token_id, label, role, created_at, last_used_at, revoked_at, token]
      properties:
        token_id: {type: string}
        label: {type: string}
        role: {type: string, enum: [viewer, operator]}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, "null"], format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        token: {type: string, pattern: "^s015_", description: "The secret. Returned only in this response."}

    AdminIdentity:
      type: object
      additionalProperties: false
      required:
        - identity_id
        - name
        - template_id
        - template_version
        - company
        - role
        - language
        - voice_profile_id
        - participant_identity
        - default_room
        - resolved_hash
        - owner_user_id
        - archived_at
      properties:
        identity_id: {type: string}
        name: {type: string}
        template_id: {type: string}
        template_version: {type: integer, minimum: 1}
        company: {type: [string, "null"]}
        role: {type: [string, "null"]}
        language: {type: string}
        voice_profile_id: {type: [string, "null"]}
        participant_identity: {type: string}
        default_room: {type: string}
        resolved_hash: {type: string}
        owner_user_id: {type: [string, "null"]}
        archived_at: {type: [string, "null"], format: date-time}

    IdentityOwnerPatch:
      type: object
      additionalProperties: false
      required: [owner_user_id]
      properties:
        owner_user_id: {type: [string, "null"]}
        clear_voice: {type: boolean, default: false, description: "Detach the voice when the new owner cannot use it."}

    TemplatePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        disabled: {type: [boolean, "null"]}
        shared: {type: [boolean, "null"]}
        owner_user_id: {type: [string, "null"]}

    VoicePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        disabled: {type: [boolean, "null"]}
        owner_user_id: {type: [string, "null"]}

    VoiceConsent:
      type: object
      additionalProperties: false
      required: [authorized_by, subject_name, consent_statement, source, created_at]
      properties:
        authorized_by: {type: string}
        subject_name: {type: string}
        consent_statement: {type: string}
        source: {type: string}
        created_at: {type: string, format: date-time}

    AdminVoice:
      type: object
      additionalProperties: false
      required: [voice_profile_id, name, language, engine, authorized, owner_user_id, shared, disabled, consent]
      properties:
        voice_profile_id: {type: string}
        name: {type: string}
        language: {type: string}
        engine: {type: string, enum: [chatterbox-turbo]}
        authorized: {type: boolean}
        owner_user_id: {type: [string, "null"]}
        shared: {type: boolean}
        disabled: {type: boolean}
        consent:
          anyOf:
            - {$ref: "#/components/schemas/VoiceConsent"}
            - {type: "null"}

    ReingestResult:
      type: object
      additionalProperties: false
      required: [repo, branch, sha, dirty, ingested, skipped, missing_required]
      properties:
        repo: {type: string}
        branch: {type: string}
        sha: {type: string}
        dirty: {type: boolean}
        ingested: {type: object, additionalProperties: {type: integer}}
        skipped:
          type: array
          items: {type: object, additionalProperties: {type: string}}
        missing_required:
          type: array
          items: {type: string}
